<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Lamps</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff; text-align: center;
      background: linear-gradient(135deg, #ff6ec4, #7873f5, #4adede, #ffd86f, #ff6ec4);
      background-size: 400% 400%;
      animation: flow 14s ease infinite;
    }
    @keyframes flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 {
      margin: 0; font-size: 38px; letter-spacing: 2px;
      text-shadow: 0 3px 12px #0004;
    }
    #status { margin: 0; font-size: 15px; font-weight: 600; text-shadow: 0 2px 6px #0004; }

    .lamp {
      width: 170px; height: 170px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #ffe066 50%, #ffa62b);
      opacity: calc(0.35 + var(--b, .5) * 0.65);
      box-shadow:
        0 0 calc(var(--b, .5) * 100px) calc(var(--b, .5) * 30px) #fff3a8,
        inset -10px -14px 30px #ff9f1c88;
      transition: all .15s;
    }
    .card {
      width: 100%; max-width: 380px; padding: 24px; border-radius: 26px;
      background: #ffffff33; border: 2px solid #ffffff66;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px #0003;
    }
    fieldset { border: 0; margin: 0; padding: 0; transition: opacity .2s; }
    fieldset:disabled { opacity: .5; }
    label { display: block; margin: 18px 0 10px; font-weight: 700; font-size: 15px; }
    input[type=range] { width: 100%; height: 30px; accent-color: #ff4fa3; }
    button {
      width: 100%; padding: 15px; font-size: 18px; font-weight: 800;
      border: 0; border-radius: 16px; cursor: pointer; color: #fff;
      box-shadow: 0 6px 18px #0003; transition: transform .1s;
    }
    button:active { transform: scale(.96); }
    #connect { background: linear-gradient(90deg, #ff4fa3, #ff8a3d); }
    #off { background: linear-gradient(90deg, #4361ee, #7b2ff7); margin-top: 20px; }
  </style>
</head>
<body>

  <p id="status">Not connected</p>
  <div class="lamp" id="lamp"></div>

  <div class="card">
    <button id="connect">Connect to lamp</button>
    <fieldset id="controls" disabled>
      <label>Brightness</label>
      <input id="slider" type="range" min="0" max="255" value="128">
      <button id="off">Turn off</button>
    </fieldset>
  </div>
