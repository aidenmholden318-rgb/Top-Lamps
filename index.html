<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Lamps</title>
  <style>
    :root { --c: #ffb347; --b: 0.5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 30%, #1d2233, #0b0d14 70%);
      color: #e8eaf2;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
    #status { margin: 0; font-size: 14px; color: #8b93ab; }
    .orb {
      width: 170px; height: 170px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff8, var(--c) 55%);
      opacity: calc(0.25 + var(--b) * 0.75);
      box-shadow: 0 0 calc(var(--b) * 90px) calc(var(--b) * 25px) var(--c);
      transition: box-shadow .15s, opacity .15s;
    }
    .card {
      width: 100%; max-width: 380px; padding: 22px; border-radius: 22px;
      background: #ffffff0d; border: 1px solid #ffffff1a;
      backdrop-filter: blur(8px);
    }
    fieldset { border: 0; margin: 0; padding: 0; transition: opacity .2s; }
    fieldset:disabled { opacity: .4; }
    label { display: block; margin: 14px 0 8px; font-size: 13px; color: #8b93ab; text-align: left; }
    input[type=range] { width: 100%; accent-color: var(--c); height: 28px; }
    .swatches { display: flex; gap: 10px; justify-content: space-between; }
    .swatches button {
      width: 40px; height: 40px; border-radius: 50%; padding: 0;
      border: 2px solid #ffffff44; cursor: pointer;
    }
    input[type=color] {
      width: 100%; height: 46px; border: 0; padding: 0; border-radius: 12px;
      background: none; cursor: pointer; margin-top: 12px;
    }
    button.main {
      width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
      border: 0; border-radius: 14px; cursor: pointer; margin-top: 18px;
      color: #10131c; background: var(--c); transition: transform .1s;
    }
    button.main:active { transform: scale(.97); }
    button.ghost { background: transparent; color: #e8eaf2; border: 1px solid #ffffff33; }
  </style>
</head>
<body>
  <h1>Top Lamps</h1>
  <p id="status">Not connected</p>
  <div class="orb" id="orb"></div>

  <div class="card">
    <button class="main" id="connect" style="margin-top:0">Connect to lamp</button>
    <fieldset id="controls" disabled>
      <label>Quick colors</label>
      <div class="swatches" id="swatches"></div>
      <input id="color" type="color" value="#ffb347" aria-label="Pick a color">
      <label>Brightness</label>
      <input id="slider" type="range" min="0" max="255" value="128">
      <button class="main ghost" id="off">Turn off</button>
    </fieldset>
  </div>

  <script>
    const SERVICE = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    let ch;
    const $ = id => document.getElementById(id);
    const color = $("color"), slider = $("slider");

    ["#ffb347", "#ffffff", "#ff3b3b", "#3bff7a", "#3b8bff", "#b04bff"].forEach(c => {
      const b = document.createElement("button");
      b.style.background = c;
      b.setAttribute("aria-label", "Color " + c);
      b.onclick = () => { color.value = c; update(); };
      $("swatches").appendChild(b);
    });

    function update() {
      document.documentElement.style.setProperty("--c", color.value);
      document.documentElement.style.setProperty("--b", slider.value / 255);
      send();
    }

    async function send() {
      if (!ch) return;
      const h = color.value;
      const r = parseInt(h.slice(1, 3), 16);
      const g = parseInt(h.slice(3, 5), 16);
      const b = parseInt(h.slice(5, 7), 16);
      try {
        await ch.writeValueWithoutResponse(Uint8Array.of(r, g, b, Number(slider.value)));
      } catch (e) { /* busy, the next change will resend */ }
    }

    $("connect").onclick = async () => {
      try {
        $("status").textContent = "Searching…";
        const dev = await navigator.bluetooth.requestDevice({
          filters: [{ name: "MyLamp" }], optionalServices: [SERVICE]
        });
        dev.addEventListener("gattserverdisconnected", () => {
          ch = null; $("controls").disabled = true;
          $("status").textContent = "Disconnected";
        });
        const server = await dev.gatt.connect();
        const svc = await server.getPrimaryService(SERVICE);
        ch = await svc.getCharacteristic(CHAR);
        $("controls").disabled = false;
        $("status").textContent = "Connected to MyLamp";
        update();
      } catch (e) {
        $("status").textContent = "Couldn’t connect. Try again.";
      }
    };

    color.oninput = update;
    slider.oninput = update;
    $("off").onclick = () => { slider.value = 0; update(); };
    update();
  </script>
</body>
</html>
